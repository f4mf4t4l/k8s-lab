# dnsmasq-Konfiguration fuer OKD SNO
# Ablegen unter /etc/dnsmasq.d/okd-sno.conf  (bzw. bei NetworkManager:
# /etc/NetworkManager/dnsmasq.d/okd-sno.conf) und dnsmasq neu starten.
#
# Werte an env anpassen: Cluster "sno", Domain "lab.local", IP 192.168.122.10

# API und interne API
host-record=api.sno.lab.local,192.168.122.10
host-record=api-int.sno.lab.local,192.168.122.10

# Wildcard fuer alle Routen (*.apps)
address=/apps.sno.lab.local/192.168.122.10

# Knoten selbst (Forward + Reverse)
host-record=sno.sno.lab.local,192.168.122.10
ptr-record=10.122.168.192.in-addr.arpa,sno.sno.lab.local

# HTPasswd Identity Provider – Secret "htpass-secret" muss in
# openshift-config existieren (wird von scripts/05-post-install.sh angelegt).
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
    - name: local
      mappingMethod: claim
      type: HTPasswd
      htpasswd:
        fileData:
          name: htpass-secret
